# =========================================================================
# QUICKSTART: server configuration (see reference.conf for details)
# =========================================================================

/* server name and administration info */
global {
    name    not.configured;         # IRC name of the server
    info    "located on earth";     # A short info line
    admin {
        "An unconfigured server";   # Three information lines sent
        "An unknown administrator"; # in reply to ADMIN command
        "email@somewhere.earth";
    };
};

/* server options */
options {
    network_name    unconfigured;   # A name is needed even if not linked
    local_kline     admin@server;   # Contact email for server bans
    show_links;                     # Show servers in LINKS
    allow_split_ops;                # Give ops in empty channels
    allow_remote_rehash;            # Accept rehash sent from remote server

    // Native services (NickServ, ChanServ, etc.) are built in.
    // Only uncomment these if you use EXTERNAL services (e.g. Anope/Atheme):
    # services_name   services.name;
    # stats_name      stats.name;

    network_kline   admin@net;      # Contact email for network bans
    nshelpurl       "http://help";  # Nick registration help page
    spamfilterurl   "http://help";  # SpamFilter help page

    // if you need to link more than 1 server, uncomment the following line
    # servtype        hub;
};

/* TLS certificate and key — required for SSL ports and STARTTLS */
ssl {
    certificate ircd.crt;           # Path to certificate (PEM)
    key         ircd.key;           # Path to private key (PEM)
};

/* where to listen for connections */
port { port 6667; bind 127.0.0.1; };               # plain IRC
port { port 6697; bind 127.0.0.1; flags S; };      # IRC over TLS
# WebSocket transport is OFF by default — uncomment a 'W'/'WS' port to enable
# browser (ws://) or TLS browser (wss://) clients.  See doc/reference.conf.
#port { port 8080; bind 127.0.0.1; flags W; };     # WebSocket (ws://)
#port { port 8443; bind 127.0.0.1; flags WS; };    # WebSocket over TLS (wss://)

/* allow clients to connect */
allow {
    host    *@*;    # Allow anyone
    class   users;  # Place them in the users class
};

/* connection class for users */
class {
    name        users;      # Class name
    maxusers    100;        # Maximum connections
    pingfreq    90;         # Check idle connections every N seconds
    maxsendq    100000;     # 100KB send buffer limit
};

/* connection class for server operators */
class {
    name        opers;
    pingfreq    90;
    maxsendq    500000;     # 500KB limit for opers
};

/* the server administrator */
oper {
    name    admin;          # Username
    passwd  secret;         # Password
    access  OAaRD;          # Server Administrator
    host    *@192.168.0.*;  # Must be connecting from here
    host    *@10.64.64.*;   # Or from here
    // insert other other hostmasks here
    class   opers;          # Belongs in the opers class
};

/* reserved nicknames (protects built-in service pseudoclients) */
restrict { type nick; mask "NickServ"; reason "reserved for services"; };
restrict { type nick; mask "ChanServ"; reason "reserved for services"; };
restrict { type nick; mask "MemoServ"; reason "reserved for services"; };
restrict { type nick; mask "RootServ"; reason "reserved for services"; };
restrict { type nick; mask "OperServ"; reason "reserved for services"; };
restrict { type nick; mask "StatServ"; reason "reserved for services"; };
restrict { type nick; mask "HelpServ"; reason "reserved for services"; };
restrict { type nick; mask "services"; reason "reserved for services"; };


/* === gossip clustering (replaces traditional server linking) === */

// Optional gossip tuning — defaults are fine for almost everyone.
// (fanout 0 = flood events to all peers; omit the whole block to use it.)
# gossip {
#     fanout      0;        # 0 = forward to all peers (default)
#     sync_window 30;       # Seconds of history to replay on reconnect
# };

// Gossip peer — one block per server you link to (configure on BOTH ends).
// The cluster just needs to be connected (chain/star/mesh all work).
// server_id is auto-derived from each server's name, so you don't set it.
# gopeer {
#     host      172.16.4.2;     # Peer's IP or hostname (omit for accept-only)
#     port      7325;           # Peer's gossip/IRC port (default 6667)
#     name      hub.name;       # Peer's global { name }
#     passwd    secret;         # Shared link secret — REQUIRED, same both ends
#     tls;                      # REQUIRED (needs the ssl {} block above)
# };
# Gossip links are authenticated and require TLS: a peer without the shared
# secret, over a TLS link, is rejected. See doc/reference.conf for details.


/* === legacy TS5 server linking (backwards compatibility) === */

// Only needed when linking to older Bahamut 2.x servers.
// For new deployments, use gossip clustering above instead.

# class {
#     name        hub;
#     pingfreq    120;
#     connfreq    300;
#     maxsendq    1000000;
#     maxlinks    1;
# };
#
# connect {
#     name        hub.name;
#     host        172.16.4.2;
#     port        7325;
#     bind        127.0.0.1;
#     apasswd     secret;
#     cpasswd     secret;
#     flags       H;            # H=hub, S=TLS, Z=compression
#     class       hub;
# };


/* === external services (only if NOT using built-in services) === */

// Bahamut 3.0 has built-in NickServ, ChanServ, MemoServ, RootServ,
// OperServ, and StatServ.  These blocks are only needed for external
// services packages like Anope or Atheme.

# super {
#     "services.name";
#     "stats.name";
# };
#
# class {
#     name        services;
#     pingfreq    60;
#     maxsendq    5000000;
# };
#
# connect {
#     name        services.name;
#     host        127.0.0.1;
#     apasswd     secret;
#     cpasswd     secret;
#     class       services;
# };


/* loadable modules */
modules {
    // Core modules are auto-loaded from <dpath>/modules/core/ and cannot
    // be unloaded.  They include: m_privmsg, m_away, m_wallops, m_who,
    // m_gossip, m_gossip_eventlog, m_legacy_bridge.

    // Extra modules live in the path below and must be explicitly loaded.
    // Editing this list and REHASHing loads/unloads modules to match.
    // All modules support hot-reload:  /MODULE RELOAD <name>
    // See modules/README.md for a description of every module.
    path    modules/extra;

    // IRCv3 capabilities (ratified / stable -- recommended)
    autoload m_away_notify;
    autoload m_account_notify;
    autoload m_account_tag;
    autoload m_batch;
    autoload m_chghost;
    autoload m_echo_message;
    autoload m_extended_join;
    autoload m_invite_notify;
    autoload m_labeled_response;
    autoload m_monitor;
    autoload m_msgid;
    autoload m_server_time;
    autoload m_setname;
    autoload m_tagmsg;
    autoload m_userhost_in_names;

    // Traditional commands
    autoload m_silence;
    autoload m_watch;
    autoload m_dcc;
    autoload m_put;
    //autoload m_check;              // CHECK (oper diagnostic)
    //autoload m_rwho;               // RWHO (regex WHO, oper)

    // IRCv3 draft extensions (specs not finalised -- enable per taste)
    //autoload m_chathistory;        // draft/chathistory
    //autoload m_tls_tag;            // draft/tls (marks TLS users)
    //autoload m_session;            // draft/resume-0.5 (connection RESUME)
    //autoload m_bot_mode;           // draft/bot (+B bot mode / tag)

    // Optional / situational
    //autoload m_starttls;           // STARTTLS opportunistic TLS upgrade; offered
                                    //   on non-S ports once a cert is configured
    //autoload m_webirc;             // WEBIRC gateway auth (only with a gateway)

    // Authentication (provided by the SASL PR; not in this build yet)
    //autoload m_sasl;
    //autoload m_account_cmds;
};
